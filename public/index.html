<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIRVEXA — Solo</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #05080d;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#menu {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.logo {
  font-size: 48px;
  font-weight: 900;
  color: #ffd400;
  letter-spacing: 5px;
  text-shadow: 0 0 20px #ffb000;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
}

.best {
  color: #ffd400;
  margin-bottom: 25px;
  font-weight: bold;
}

button {
  width: 270px;
  padding: 18px;
  margin: 8px;
  border: none;
  border-radius: 12px;
  background: #ffd400;
  color: #080808;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(.96);
}

#game {
  display: none;
  height: 100vh;
  position: relative;
  background: radial-gradient(circle, #18202a 0%, #05080d 75%);
}

#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  justify-content: space-around;
  padding: 14px 5px;
  background: rgba(0,0,0,.8);
  border-bottom: 1px solid #333;
  font-weight: bold;
}

.hudItem {
  text-align: center;
}

.hudValue {
  color: #ffd400;
  font-size: 21px;
}

#arena {
  position: absolute;
  top: 70px;
  left: 0;
  right: 0;
  bottom: 0;
}

#target {
  position: absolute;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #111 0 12%,
    white 13% 25%,
    #e51b23 26% 45%,
    white 46% 63%,
    #e51b23 64% 100%
  );
  border: 3px solid white;
  box-shadow: 0 0 20px rgba(255,0,0,.7);
  display: none;
  transform: translate(-50%, -50%);
}

#message {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#messageBox {
  background: rgba(0,0,0,.92);
  padding: 28px 20px;
  border-radius: 18px;
  border: 1px solid #555;
  display: none;
  width: 90%;
  max-width: 400px;
}

#messageBox h1 {
  color: #ffd400;
}

.resultLine {
  margin: 10px;
  font-size: 20px;
}

.highlight {
  color: #ffd400;
  font-weight: bold;
}

#credits {
  position: absolute;
  bottom: 12px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="menu">

  <div class="logo">TIRVEXA</div>

  <div class="subtitle">
    VERSION 1.2 — SOLO
  </div>

  <div class="best">
    🏆 MEILLEUR SCORE :
    <span id="bestMenu">0</span>
  </div>

  <button onclick="startGame()">
    🎯 LANCER LA PARTIE
  </button>

  <button onclick="training()">
    🏋️ ENTRAÎNEMENT
  </button>

  <div id="credits">
    Propriétaire : DJABEA ANGEL<br>
    Créateur : DJABEA ANGEL<br>
    © 2026 TIRVEXA — Tous droits réservés.
  </div>

</div>


<div id="game">

  <div id="hud">

    <div class="hudItem">
      SCORE<br>
      <span id="score" class="hudValue">0</span>
    </div>

    <div class="hudItem">
      TEMPS<br>
      <span id="time" class="hudValue">30</span>
    </div>

    <div class="hudItem">
      VIES<br>
      <span id="lives" class="hudValue">❤️❤️❤️</span>
    </div>

    <div class="hudItem">
      TOUCHES<br>
      <span id="hits" class="hudValue">0</span>
    </div>

  </div>

  <div id="arena">

    <div id="target" onclick="shoot(event)"></div>

    <div id="message">

      <div id="messageBox">

        <h1>🏆 PARTIE TERMINÉE</h1>

        <div class="resultLine">
          Score final :
          <span id="resultScore" class="highlight">0</span>
        </div>

        <div class="resultLine">
          Cibles touchées :
          <span id="resultHits" class="highlight">0</span>
        </div>

        <div class="resultLine">
          Meilleur score :
          <span id="resultBest" class="highlight">0</span>
        </div>

        <div id="newRecord"
             style="display:none;color:#00ff88;font-weight:bold;margin:15px;">
          🔥 NOUVEAU RECORD !
        </div>

        <button onclick="startGame()">
          🔄 REJOUER
        </button>

        <button onclick="backMenu()">
          🏠 MENU
        </button>

      </div>

    </div>

  </div>

</div>


<script>

let score = 0;
let lives = 3;
let timeLeft = 30;
let hits = 0;
let gameRunning = false;
let timer = null;

let bestScore =
  Number(localStorage.getItem("tirvexa_best_score")) || 0;

const target = document.getElementById("target");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const livesText = document.getElementById("lives");
const hitsText = document.getElementById("hits");

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const messageBox = document.getElementById("messageBox");

const resultScore = document.getElementById("resultScore");
const resultHits = document.getElementById("resultHits");
const resultBest = document.getElementById("resultBest");
const bestMenu = document.getElementById("bestMenu");
const newRecord = document.getElementById("newRecord");


bestMenu.textContent = bestScore;


function startGame() {

  score = 0;
  lives = 3;
  timeLeft = 30;
  hits = 0;
  gameRunning = true;

  menu.style.display = "none";
  game.style.display = "block";

  messageBox.style.display = "none";

  updateHUD();
  moveTarget();

  clearInterval(timer);

  timer = setInterval(() => {

    timeLeft--;

    updateHUD();

    if (timeLeft <= 0) {
      endGame();
    }

  }, 1000);
}


function updateHUD() {

  scoreText.textContent = score;
  timeText.textContent = timeLeft;
  hitsText.textContent = hits;

  let hearts = "";

  for (let i = 0; i < lives; i++) {
    hearts += "❤️";
  }

  if (lives <= 0) {
    hearts = "💀";
  }

  livesText.textContent = hearts;
}


function moveTarget() {

  if (!gameRunning) return;

  const arena = document.getElementById("arena");

  const margin = 50;

  const x =
    margin +
    Math.random() *
    (arena.clientWidth - margin * 2);

  const y =
    margin +
    Math.random() *
    (arena.clientHeight - margin * 2);

  target.style.left = x + "px";
  target.style.top = y + "px";
  target.style.display = "block";
}


function shoot(event) {

  if (!gameRunning) return;

  event.stopPropagation();

  score += 10;
  hits++;

  updateHUD();
  moveTarget();
}


document.getElementById("arena").addEventListener("click", function(event) {

  if (!gameRunning) return;

  if (event.target === target) return;

  lives--;

  updateHUD();

  if (lives <= 0) {
    endGame();
  }

});


function endGame() {

  gameRunning = false;

  clearInterval(timer);

  target.style.display = "none";

  let record = false;

  if (score > bestScore) {

    bestScore = score;

    localStorage.setItem(
      "tirvexa_best_score",
      bestScore
    );

    record = true;
  }

  resultScore.textContent = score;
  resultHits.textContent = hits;
  resultBest.textContent = bestScore;

  newRecord.style.display =
    record ? "block" : "none";

  bestMenu.textContent = bestScore;

  messageBox.style.display = "block";
}


function backMenu() {

  clearInterval(timer);

  gameRunning = false;

  game.style.display = "none";
  menu.style.display = "flex";

  target.style.display = "none";

  bestMenu.textContent = bestScore;
}


function training() {

  alert(
    "MODE ENTRAÎNEMENT\n\n" +
    "Le mode entraînement sera développé prochainement."
  );

}

</script>

</body>
</html>
