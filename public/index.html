<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIRVEXA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 25px 20px;
      background: linear-gradient(180deg, #111823, #05070a);
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffd400;
      margin-top: 30px;
    }

    .version {
      color: #aaa;
      margin-bottom: 50px;
    }

    .player {
      background: #151c27;
      border: 1px solid #303b4c;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .player strong {
      color: #ffd400;
      font-size: 20px;
    }

    h1 {
      font-size: 30px;
      margin: 30px 0 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .solo {
      background: #ffd400;
      color: #080b10;
    }

    .training {
      background: #252e3b;
      color: white;
    }

    .status {
      margin-top: 25px;
      padding: 12px;
      border-radius: 10px;
      background: #101820;
      color: #52e27a;
      font-size: 14px;
    }

    footer {
      margin-top: 45px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <main class="game">

    <div class="logo">TIRVEXA</div>
    <div class="version">VERSION 1.0 — SOLO</div>

    <div class="player">
      👤 <strong>DJABEA ANGEL</strong>
      <br>
      Niveau 1
    </div>

    <h1>PRÊT À TIRER ?</h1>
    <div class="subtitle">
      Choisis ton mode de jeu
    </div>

    <button class="solo" onclick="startGame('Solo')">
      🎯 SOLO
    </button>

    <button class="training" onclick="startGame('Entraînement')">
      🏋️ ENTRAÎNEMENT
    </button>

    <div class="status">
      ● SERVEUR TIRVEXA — EN LIGNE
    </div>

    <footer>
      Propriétaire : DJABEA ANGEL<br>
      Créateur : DJABEA ANGEL<br>
      © 2026 TIRVEXA — Tous droits réservés.
    </footer>

  </main>

  <script>
    function startGame(mode) {
      alert("Mode " + mode + " sélectionné !");
    }
  </script>

</body>
</html>
