<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIRVEXA</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #05080d;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  width: 270px;
  padding: 17px;
  margin: 7px;
  border: 0;
  border-radius: 12px;
  background: #ffd400;
  color: #080808;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(.96);
}

#menu {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.logo {
  font-size: 48px;
  font-weight: 900;
  color: #ffd400;
  letter-spacing: 5px;
  text-shadow: 0 0 20px #ffb000;
}

.subtitle {
  color: #aaa;
  margin: 8px 0 25px;
}

.best {
  color: #ffd400;
  margin-bottom: 20px;
  font-weight: bold;
}

#credits {
  position: absolute;
  bottom: 12px;
  color: #777;
  font-size: 12px;
}

#game {
  display: none;
  height: 100vh;
  position: relative;
  background: radial-gradient(circle, #18202a 0%, #05080d 75%);
}

#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  justify-content: space-around;
  padding: 13px 4px;
  background: rgba(0,0,0,.85);
  border-bottom: 1px solid #333;
  font-weight: bold;
}

.hudItem {
  text-align: center;
  font-size: 12px;
}

.hudValue {
  color: #ffd400;
  font-size: 20px;
}

#arena {
  position: absolute;
  top: 68px;
  left: 0;
  right: 0;
  bottom: 0;
}

#target {
  position: absolute;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle,
      #111 0 12%,
      white 13% 25%,
      #e51b23 26% 45%,
      white 46% 63%,
      #e51b23 64% 100%
    );
  border: 3px solid white;
  box-shadow: 0 0 20px rgba(255,0,0,.7);
  display: none;
  transform: translate(-50%, -50%);
}

#message {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 20;
}

#messageBox {
  background: rgba(0,0,0,.94);
  padding: 28px 18px;
  border-radius: 18px;
  border: 1px solid #555;
  display: none;
  width: 90%;
  max-width: 400px;
}

#messageBox h1 {
  color: #ffd400;
}

.resultLine {
  margin: 10px;
  font-size: 19px;
}

.highlight {
  color: #ffd400;
  font-weight: bold;
}

#newRecord {
  display: none;
  color: #00ff88;
  font-weight: bold;
  margin: 15px;
}
</style>
</head>

<body>

<div id="menu">

  <div class="logo">TIRVEXA</div>

  <div class="subtitle">VERSION 1.4</div>

  <div class="best">
    🏆 MEILLEUR SCORE :
    <span id="bestMenu">0</span>
  </div>

  <button onclick="startSolo()">🎯 SOLO</button>

  <button onclick="startTraining()">🏋️ ENTRAÎNEMENT</button>

  <div id="credits">
    Propriétaire : DJABEA ANGEL<br>
    Créateur : DJABEA ANGEL<br>
    © 2026 TIRVEXA — Tous droits réservés.
  </div>

</div>


<div id="game">

  <div id="hud">

    <div class="hudItem">
      MODE<br>
      <span id="modeText" class="hudValue">SOLO</span>
    </div>

    <div class="hudItem">
      SCORE<br>
      <span id="score" class="hudValue">0</span>
    </div>

    <div class="hudItem">
      TEMPS<br>
      <span id="time" class="hudValue">30</span>
    </div>

    <div class="hudItem">
      TOUCHES<br>
      <span id="hits" class="hudValue">0</span>
    </div>

    <div class="hudItem" id="livesBox">
      VIES<br>
      <span id="lives" class="hudValue">❤️❤️❤️</span>
    </div>

  </div>


  <div id="arena">

    <div id="target" onclick="shoot(event)"></div>

    <div id="message">

      <div id="messageBox">

        <h1 id="resultTitle">PARTIE TERMINÉE</h1>

        <div class="resultLine">
          Score :
          <span id="resultScore" class="highlight">0</span>
        </div>

        <div class="resultLine">
          Cibles touchées :
          <span id="resultHits" class="highlight">0</span>
        </div>

        <div class="resultLine">
          Tirs :
          <span id="resultShots" class="highlight">0</span>
        </div>

        <div class="resultLine">
          Précision :
          <span id="resultAccuracy" class="highlight">0%</span>
        </div>

        <div class="resultLine">
          Meilleur score :
          <span id="resultBest" class="highlight">0</span>
        </div>

        <div id="newRecord">🔥 NOUVEAU RECORD !</div>

        <button onclick="restartCurrentMode()">🔄 REJOUER</button>

        <button onclick="backMenu()">🏠 MENU</button>

      </div>

    </div>

  </div>

</div>


<script>

let mode = "";
let score = 0;
let lives = 3;
let timeLeft = 30;
let hits = 0;
let shots = 0;
let gameRunning = false;

let timer = null;
let targetMoveTimer = null;

let bestScore =
  Number(localStorage.getItem("tirvexa_best_score")) || 0;


const menu = document.getElementById("menu");
const game = document.getElementById("game");
const arena = document.getElementById("arena");
const target = document.getElementById("target");

const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const livesText = document.getElementById("lives");
const hitsText = document.getElementById("hits");
const modeText = document.getElementById("modeText");
const livesBox = document.getElementById("livesBox");

const messageBox = document.getElementById("messageBox");
const resultTitle = document.getElementById("resultTitle");
const resultScore = document.getElementById("resultScore");
const resultHits = document.getElementById("resultHits");
const resultShots = document.getElementById("resultShots");
const resultAccuracy = document.getElementById("resultAccuracy");
const resultBest = document.getElementById("resultBest");
const newRecord = document.getElementById("newRecord");
const bestMenu = document.getElementById("bestMenu");


bestMenu.textContent = bestScore;


function startSolo() {

  mode = "solo";

  startGame("SOLO", 30, true);
}


function startTraining() {

  mode = "training";

  startGame("ENTRAÎNEMENT", 60, false);
}


function startGame(gameMode, duration, hasLives) {

  score = 0;
  lives = 3;
  hits = 0;
  shots = 0;
  timeLeft = duration;
  gameRunning = true;

  clearInterval(timer);
  clearInterval(targetMoveTimer);

  menu.style.display = "none";
  game.style.display = "block";
  messageBox.style.display = "none";

  modeText.textContent = gameMode;

  livesBox.style.display =
    hasLives ? "block" : "none";

  updateHUD();

  moveTarget();

  /*
    LA CIBLE BOUGE AUTOMATIQUEMENT
    toutes les 1,2 secondes.
  */

  targetMoveTimer = setInterval(() => {

    if (gameRunning) {
      moveTarget();
    }

  }, 1200);


  timer = setInterval(() => {

    timeLeft--;

    updateHUD();

    if (timeLeft <= 0) {
      endGame();
    }

  }, 1000);
}


function updateHUD() {

  scoreText.textContent = score;
  timeText.textContent = timeLeft;
  hitsText.textContent = hits;

  let hearts = "";

  for (let i = 0; i < lives; i++) {
    hearts += "❤️";
  }

  livesText.textContent =
    lives > 0 ? hearts : "💀";
}


function moveTarget() {

  if (!gameRunning) return;

  const margin = 55;

  const maxX =
    arena.clientWidth - margin;

  const maxY =
    arena.clientHeight - margin;

  const x =
    margin +
    Math.random() *
    Math.max(1, maxX - margin);

  const y =
    margin +
    Math.random() *
    Math.max(1, maxY - margin);

  target.style.left = x + "px";
  target.style.top = y + "px";

  target.style.display = "block";
}


function shoot(event) {

  if (!gameRunning) return;

  event.stopPropagation();

  shots++;
  hits++;

  if (mode === "solo") {
    score += 10;
  } else {
    score += 5;
  }

  updateHUD();

  /*
    Quand on touche la cible,
    elle change immédiatement
    de position.
  */

  moveTarget();
}


arena.addEventListener("click", function(event) {

  if (!gameRunning) return;

  if (event.target === target) return;

  shots++;

  /*
    En entraînement :
    aucune vie perdue.
  */

  if (mode === "solo") {

    lives--;

    updateHUD();

    if (lives <= 0) {
      endGame();
    }
  }

});


function endGame() {

  gameRunning = false;

  clearInterval(timer);
  clearInterval(targetMoveTimer);

  target.style.display = "none";

  const accuracy =
    shots > 0
      ? Math.round((hits / shots) * 100)
      : 0;

  let record = false;

  if (
    mode === "solo" &&
    score > bestScore
  ) {

    bestScore = score;

    localStorage.setItem(
      "tirvexa_best_score",
      bestScore
    );

    record = true;
  }


  if (mode === "training") {

    resultTitle.textContent =
      "🏋️ ENTRAÎNEMENT TERMINÉ";

  } else {

    resultTitle.textContent =
      "🏆 PARTIE TERMINÉE";
  }


  resultScore.textContent = score;
  resultHits.textContent = hits;
  resultShots.textContent = shots;
  resultAccuracy.textContent = accuracy + "%";
  resultBest.textContent = bestScore;

  newRecord.style.display =
    record ? "block" : "none";

  bestMenu.textContent = bestScore;

  messageBox.style.display = "block";
}


function restartCurrentMode() {

  if (mode === "training") {
    startTraining();
  } else {
    startSolo();
  }
}


function backMenu() {

  clearInterval(timer);
  clearInterval(targetMoveTimer);

  gameRunning = false;

  target.style.display = "none";

  game.style.display = "none";
  menu.style.display = "flex";

  bestMenu.textContent = bestScore;
}

</script>

</body>
</html>
